[package]
name = "inkling-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "inkling"
path = "src/main.rs"

[dependencies]
inkling = { path = "../inkling" }
inkling-metal = { path = "../inkling-metal" }
gguf = { path = "../gguf" }
anyhow.workspace = true
# preserve_order: tool call arguments keep the client's key order inside nested values, as the
# template's tojson does
serde_json = { workspace = true, features = ["preserve_order"] }
