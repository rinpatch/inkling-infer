[workspace]
resolver = "3"
members = ["crates/gguf", "crates/inkling", "crates/inkling-metal", "crates/inkling-cli"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
memmap2 = "0.9"
half = "2"
thiserror = "2"
anyhow = "1"
rayon = "1"
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# Tests run real-model forward passes; unoptimized f32 loops would take hours.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
